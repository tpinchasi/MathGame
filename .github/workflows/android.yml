name: Android app

# Builds the installable APK from the web game in /public, then launches it once on an
# emulator and keeps a screenshot, so a broken build is caught before it reaches a phone.
on:
  push:
    paths:
      - 'android/**'
      - 'public/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore the signing key
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key in the repository secrets; signing with the debug key."
          fi
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk nekamat-hacheshbonaim.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nekamat-apk
          path: nekamat-hacheshbonaim.apk

  smoke:
    name: Launch on an emulator
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nekamat-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The taps (Pixel 6 coordinates) dismiss the opening story and open the first planet;
      # the relaunch shows whether progress survived, i.e. the story must not appear again.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install nekamat-hacheshbonaim.apk
            adb shell am start -W -n io.github.tpinchasi.nekamat/.MainActivity
            sleep 25
            adb exec-out screencap -p > screen-1-first-launch.png
            adb shell input tap 540 1698
            sleep 2
            adb exec-out screencap -p > screen-2-after-story.png
            adb shell input tap 798 576
            sleep 2
            adb exec-out screencap -p > screen-3-planet.png
            adb shell am force-stop io.github.tpinchasi.nekamat
            sleep 5
            adb shell am start -W -n io.github.tpinchasi.nekamat/.MainActivity
            sleep 10
            adb exec-out screencap -p > screen-4-relaunch.png
            adb shell dumpsys activity activities | grep -E "ResumedActivity|nekamat" > activity.txt || true
            adb shell pidof io.github.tpinchasi.nekamat > pid.txt || true
            adb logcat -d -v brief chromium:V AndroidRuntime:E ActivityTaskManager:I ActivityManager:I DEBUG:E libc:E '*:S' > logcat.txt
            adb shell dumpsys package io.github.tpinchasi.nekamat | grep -E "versionName|requested permissions|install permissions" > package.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke
          path: |
            screen-*.png
            logcat.txt
            package.txt
            activity.txt
            pid.txt
